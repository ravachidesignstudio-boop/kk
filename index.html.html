.vm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.vm .panel{padding:26px}.vm h2{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:6px 0 10px}.vm p{color:var(--mute);margin:0}
.gl{counter-reset:g;display:grid;gap:12px;padding:0;list-style:none}.gl li{counter-increment:g;display:flex;gap:14px;align-items:flex-start}.gl li:before{content:counter(g);flex:none;width:34px;height:34px;border-radius:50%;background:var(--sage);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.gl b{display:block}.gl span{color:var(--mute);font-size:15px}
.mk-fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;border:0;border-radius:99px;padding:8px 18px 8px 8px;background:var(--sage);color:#fff;font:700 15px inherit;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mk-av{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--sage);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.mk{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:70;width:min(380px,calc(100vw - 24px));height:min(560px,calc(100dvh - 24px));display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.3);overflow:hidden}
.mk[hidden]{display:none}.mk header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sage);color:#fff}.mk header div{flex:1}.mk header small{display:block;opacity:.85}.mk header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#mk-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.mk-m{max-width:85%;padding:9px 13px;border-radius:16px;line-height:1.4;font-size:15px;white-space:pre-wrap}.mk-m.b{background:color-mix(in srgb,var(--sage) 14%,transparent);align-self:flex-start;border-bottom-left-radius:4px}.mk-m.u{background:var(--sage);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#mk-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}#mk-chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.mk-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.mk-in input{flex:1;min-width:0}
.err{display:block;color:var(--brick);font-size:13px;font-weight:600;margin-top:4px}input.bad,select.bad,textarea.bad{border-color:var(--brick)!important}.form.panel .chips{gap:6px}.form.panel{display:grid;gap:12px}
</style>

function pickPhoto(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.photo=c.toDataURL('image/jpeg',.8);document.getElementById('pv').innerHTML=`<img class="av" src="${S.photo}" alt="Your new photo">`};im.src=r.result};
 r.readAsDataURL(f);
}
function saveProfile(){
 const w=wk(S.user.id),g=k=>document.getElementById(k).value.trim();

 if(S.photo)w.photo=S.photo;S.user.name=w.name;toast('Profile uploaded. Businesses can now find you.');render();
}

addEventListener('hashchange',()=>{const h=location.hash.slice(1);S.page=okP(h)?h:null;S.view=null;render();scrollTo(0,0)});

async function api(path,o={}){
 const h={};if(TOKEN)h.Authorization='Token '+TOKEN;if(o.body)h['Content-Type']='application/json';
 const r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.form||(o.body?JSON.stringify(o.body):undefined)});
 const d=r.status===204?null:await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&TOKEN)clearAuth();const e=new Error(d.detail||Object.values(d).flat().join(' ')||'Something went wrong. Please try again.');e.status=r.status;throw e}
 return d}
function clearAuth(){TOKEN=null;try{localStorage.removeItem('ks_tok')}catch(e){}}
async function pages(path){let out=[],u=path+(path.includes('?')?'&':'?')+'page_size=200';
 while(u){const d=await api(u);if(Array.isArray(d))return d;out=out.concat(d.results);u=d.next?d.next.slice(d.next.indexOf('/api')+4):null}return out}

const mapB=b=>({id:sid(b.id),name:b.name,city:b.city,status:b.status,plan:b.plan||'Free',credits:b.credits||0});
const mapS=s=>({id:sid(s.id),bizId:sid(s.business),workerId:sid(s.worker.id),status:s.status});
async function hydrate(){
 const u=S.user,n={biz:[],workers:[],sel:[],inv:[]};
 let pub=[];try{pub=(await pages('/workers/')).map(mapW)}catch(e){}
 n.workers=pub;
 if(u&&u.role==='worker'){
  const me=mapW(await api('/me/worker/'));n.workers=[me].concat(pub.filter(w=>w.id!==me.id));
  (await api('/me/chosen/')).forEach(c=>{n.biz.push(mapB(c.business));n.sel.push({id:sid(c.id),bizId:sid(c.business.id),workerId:me.id,status:c.status})});
 }else if(u&&u.role==='biz'){
  const b=mapB(await api('/me/business/'));n.biz=[b];
  const ss=await pages('/selections/');n.sel=ss.map(mapS);
  const got=ss.map(s=>mapW(s.worker));n.workers=got.concat(pub.filter(w=>!got.some(g=>g.id===w.id)));
  n.inv=(await api('/billing/')).invoices.map(v=>({id:sid(v.id),bizId:b.id,plan:v.plan,amt:v.amount,status:v.status}));
 }else if(u&&u.role==='admin'){
  n.workers=(await pages('/admin/workers/')).map(mapW);n.biz=(await pages('/admin/businesses/')).map(mapB);
  n.sel=(await pages('/selections/')).map(mapS);
  n.inv=(await pages('/admin/invoices/')).map(v=>({id:sid(v.id),bizId:sid(v.business),plan:v.plan,amt:v.amount,status:v.status}));
 }
 D=n}

function emp(s){return String(s).replace(/(?<!Factory |Construction )workers/g,'employees').replace(/(?<!Factory |Construction )Workers/g,'Employees').replace(/(?<!Factory |Construction )worker/g,'employee').replace(/(?<!Factory |Construction )Worker/g,'Employee').replace(/(?<!बांधकाम )(?<!कारखाना )(?<!फैक्ट्री )कामगार/g,'कर्मचारी')}
function INR(n){return '₹'+Number(n).toLocaleString('en-IN')}
function payNum(s){const m=String(s||'').match(/\d[\d,]*/);return m?m[0].replace(/,/g,''):''}
function mpay(s){s=String(s||'');const n=+payNum(s);if(!n)return s;if(/day/i.test(s))return INR(Math.round(n*26/500)*500)+' / month';if(/week/i.test(s))return INR(Math.round(n*4.3/500)*500)+' / month';return INR(n)+' / month'}

function ph(s){let d=String(s).replace(/[\s()-]/g,'');if(d.length>10)d=d.replace(/^\+?91/,'').replace(/^0/,'');return /^[6-9]\d{9}$/.test(d)?d:null}

  e.push(['f5',RX.pw.test(pw)?'':'Use 8 or more characters with at least one letter and one number.']);

  e.push(['f7',document.getElementById('f7').checked?'':'Please accept the Terms and Privacy Policy.'])}
 if(!chk(e))return toast('Please fix the highlighted fields.');
 const id=r==='admin'?v('f4'):ph(v('f4')),NM={worker:'an employee',biz:'a business',admin:'an admin'};
 try{let d;
  if(old){try{d=await api('/auth/login/',{method:'POST',body:{phone:id,password:pw}})}catch(x){if(r!=='admin'&&x.status===400&&v('f4')!==id)d=await api('/auth/login/',{method:'POST',body:{phone:v('f4'),password:pw}});else throw x}}
  else{const b={name:v('f1'),phone:id,password:pw,city:v('f3')};if(r==='worker')b.skill=v('f2');d=await api('/auth/register/'+(r==='worker'?'worker':'business')+'/',{method:'POST',body:b})}
  if(d.role!==r)return toast('This account is '+NM[d.role]+' account. Please use the '+({worker:'Employee',biz:'Business',admin:'Admin'})[d.role]+' tab.');
  await start(d)}catch(x){toast(x.message)}}
async function saveProfile(){
 clr();const g=k=>document.getElementById(k).value.trim(),n=+g('p4'),pay=+g('p6'),about=g('p8');
 const ok=chk([['p1',RX.name.test(g('p1'))?'':'Enter your full name (letters only).'],['p3',RX.city.test(g('p3'))?'':'Enter a valid city.'],['p4',g('p4')!==''&&Number.isInteger(n)&&n>=0&&n<=50?'':'Enter whole years between 0 and 50.'],['p6',pay>=3000&&pay<=500000?'':'Enter monthly pay between ₹3,000 and ₹5,00,000.'],['p5',ph(g('p5'))?'':'Enter a valid 10-digit mobile number.'],['p8',about.length<=300?'':'Keep this under 300 characters.']]);
 if(!ok)return toast('Please fix the highlighted fields.');
 const f=new FormData();[['name',g('p1')],['skill',g('p2')],['city',g('p3')],['exp',n],['pay',INR(pay)+' / month'],['avail',g('p7')],['phone',ph(g('p5'))],['about',about]].forEach(([k,x])=>f.append(k,x));
 if(S.photo){const b=await (await fetch(S.photo)).blob();f.append('photo',b,'photo.jpg')}
 try{await api('/me/worker/',{method:'PATCH',form:f});S.user.name=g('p1');S.photo=null;await hydrate();toast('Profile saved. Businesses can now find you.');render()}catch(e){toast(e.message)}}

/* ===== OTP login, clearer server errors, Razorpay payment links ===== */
const RZP_LINKS={Starter:'',Professional:''}; /* paste your Razorpay Payment Link URLs, e.g. https://rzp.io/l/xxxx */
const RZP_OK=/^https:\/\/(rzp\.io|pages\.razorpay\.com|razorpay\.com)\//;
async function api(path,o={}){
 const h={};if(TOKEN)h.Authorization='Token '+TOKEN;if(o.body)h['Content-Type']='application/json';
 let r;try{r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.form||(o.body?JSON.stringify(o.body):undefined)})}
 catch(e){const x=new Error('Cannot reach the KaamSetu server. Check your internet and try again.');x.status=0;throw x}
 const json=(r.headers.get('content-type')||'').includes('json');
 if(r.status!==204&&!json){const x=new Error('The KaamSetu server is not available right now (error '+r.status+').');x.status=r.status;throw x}
 const d=r.status===204?null:await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&TOKEN)clearAuth();const x=new Error(d.detail||Object.values(d).flat().join(' ')||'Something went wrong. Please try again.');x.status=r.status;throw x}
 return d}
const TT3={worker:'Employee',biz:'Business',admin:'Admin'},MSGP='Enter a valid 10-digit mobile number starting with 6, 7, 8 or 9.';
function loginView(r){
 clearInterval(S.ot);const adm=r==='admin',old=adm||S.mode==='old';
 const tb=['worker','biz','admin'].map(k=>`<button type="button" class="pillb ${k===r?'on':''}" onclick="S.view='${k}';if('${k}'==='admin')S.mode='old';render()">${TT3[k]}</button>`).join('');
 let f='';
 if(!old){f+=`<label>${r==='worker'?'Full name':'Business name'}<input id="f1" autocomplete="${r==='worker'?'name':'organization'}"></label>`;
  if(r==='worker')f+=`<label>Your work<select id="f2">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>`;
  f+=`<label>City<input id="f3" placeholder="e.g. Navi Mumbai" autocomplete="address-level2"></label>`}
 f+=`<label>${adm?'Username':'Mobile number'}<input id="f4" ${adm?'autocomplete="username"':'inputmode="tel" maxlength="16" placeholder="10-digit mobile number" autocomplete="tel"'}></label>`;
 if(adm)f+=`<label>Password<input id="f5" type="password" autocomplete="current-password"></label><button class="btn gold" onclick="enter('admin')">Log in</button>`;
 else{if(!old)f+=`<label style="display:flex;gap:8px;align-items:flex-start"><input id="f7" type="checkbox" style="margin-top:5px"><span>I agree to the <a href="#terms" onclick="event.preventDefault();P('terms')">Terms</a> and <a href="#privacy" onclick="event.preventDefault();P('privacy')">Privacy Policy</a>.</span></label>`;
  f+=`<button type="button" class="btn gold" id="otpb" onclick="sendOtp('${r}')">Send OTP</button><div id="otpbox" style="display:none;gap:10px"><label>Enter the 6-digit OTP sent to your mobile<input id="f8" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit OTP"></label><button class="btn gold" onclick="verifyOtp('${r}')">Verify OTP &amp; ${old?'log in':'create account'}</button><div class="row"><button type="button" class="btn ghost sm" id="rsd" onclick="sendOtp('${r}')" disabled>Resend OTP</button><button type="button" class="btn ghost sm" onclick="chgNum()">Change number</button></div></div>`}
 const seg=adm?'':`<div class="chips" style="margin:0"><button type="button" class="pillb ${old?'on':''}" onclick="S.mode='old';render()">Log in</button><button type="button" class="pillb ${old?'':'on'}" onclick="S.mode='new';render()">${r==='worker'?'Create profile':'Sign up'}</button></div>`;
 $a.innerHTML=`<div class="form panel" onkeydown="fkey(event,'${r}')"><div class="chips" style="margin:0">${tb}</div><h2>${TT3[r]} ${old?'login':(r==='worker'?'profile':'registration')}</h2>${seg}${f}<button class="btn ghost" onclick="go()">Back</button></div>`}
function fkey(e,r){if(e.key!=='Enter'||e.target.tagName==='BUTTON')return;if(r==='admin')return enter('admin');document.getElementById('otpbox').style.display==='grid'?verifyOtp(r):sendOtp(r)}
const gv=k=>(document.getElementById(k)?.value||'').trim();
function cool(){let n=30;clearInterval(S.ot);const t=()=>{const e=document.getElementById('rsd');if(!e){clearInterval(S.ot);return}if(n>0){e.disabled=true;e.textContent='Resend OTP in '+n+'s';n--}else{e.textContent='Resend OTP';e.disabled=false;clearInterval(S.ot)}};t();S.ot=setInterval(t,1000)}
function lock(x){['f1','f2','f3','f4'].forEach(k=>{const e=document.getElementById(k);if(e){e.readOnly=x;if(e.tagName==='SELECT')e.disabled=x}})}
function chgNum(){clearInterval(S.ot);lock(false);document.getElementById('otpbox').style.display='none';document.getElementById('otpb').style.display='';document.getElementById('otpb').disabled=false;document.getElementById('f8').value='';clr()}
async function sendOtp(r){
 clr();const old=S.mode==='old',e=[['f4',ph(gv('f4'))?'':MSGP]];
 if(!old){e.push(['f1',r==='worker'?(RX.name.test(gv('f1'))?'':'Enter your full name (letters only, 2–60 characters).'):(gv('f1').length>=2&&gv('f1').length<=80?'':'Enter your business name (2–80 characters).')]);
  e.push(['f3',RX.city.test(gv('f3'))?'':'Enter your city (letters only).']);e.push(['f7',document.getElementById('f7').checked?'':'Please accept the Terms and Privacy Policy.'])}
 if(!chk(e))return toast('Please fix the highlighted fields.');
 const b=document.getElementById('otpb'),p=ph(gv('f4'));b.disabled=true;
 try{await api('/auth/otp/send/',{method:'POST',body:{phone:p,role:r,purpose:old?'login':'register'}});
  lock(true);b.style.display='none';document.getElementById('otpbox').style.display='grid';document.getElementById('f8').focus();cool();toast('OTP sent to +91 '+p.slice(0,2)+'XXXXXX'+p.slice(-2)+'.')}
 catch(x){b.disabled=false;toast(x.message)}}
async function verifyOtp(r){
 clr();const old=S.mode==='old',otp=gv('f8');
 if(!chk([['f8',/^\d{6}$/.test(otp)?'':'Enter the 6-digit OTP.']]))return;
 const body={phone:ph(gv('f4')),otp,role:r,purpose:old?'login':'register'};if(!old){body.name=gv('f1');body.city=gv('f3');if(r==='worker')body.skill=gv('f2')}
 try{const d=await api('/auth/otp/verify/',{method:'POST',body});
  if(d.role!==r)return toast('This number is registered as '+({worker:'an employee',biz:'a business',admin:'an admin'})[d.role]+'. Please use the '+TT3[d.role]+' tab.');
  await start(d)}catch(x){toast(x.message)}}
function billView(b){
 const mine=D.inv.filter(v=>v.bizId===b.id),cur=b.plan,pay=S.pay&&RZP_OK.test(S.pay.url)?S.pay:null;
 return `<div class="panel" style="margin-bottom:14px"><b>Your plan: ${cur}</b><div class="meta">${b.credits} contact credit${b.credits===1?'':'s'} left. Each worker you select uses 1 credit. Hiring has no extra fee.</div></div>`+(pay?`<div class="panel" style="margin-bottom:14px;border-color:var(--sage)"><b>Pay for the ${esc(pay.plan)} plan</b><div class="meta">Your secure Razorpay link is ready. Your plan switches on after Razorpay confirms the payment.</div><p style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0"><a class="btn gold" href="${esc(pay.url)}" target="_blank" rel="noopener noreferrer">Click here to pay ₹${PL[pay.plan][0]} on Razorpay</a><button class="btn ghost" onclick="refreshBill()">I have paid, refresh</button></p></div>`:'')+`<div class="pg" style="margin:0 0 22px">${Object.entries(PL).map(([n,[pr,cr]])=>`<div class="pc${n===cur?' hot':''}">${n===cur?'<span class="tag">Current plan</span>':''}<div class="nm">${n}</div><div class="pp">₹${pr}<small>${pr?'/ month':'forever'}</small></div><div class="pd">${cr} contact credits${pr?' every month':''}</div>${n===cur?'<button class="btn ghost" disabled>Your plan</button>':pr>PL[cur][0]?`<button class="btn gold" onclick="payPlan('${n}')">Pay ₹${pr} with Razorpay</button>`:`<button class="btn ghost" onclick="setPlan('${n}')">Switch to ${n}</button>`}</div>`).join('')}</div><h3 style="margin-bottom:10px">Payments</h3>`+(mine.length?`<div class="list">${mine.map(v=>`<div class="panel row"><div><b>${v.plan} plan, 1 month</b><div class="meta">₹${v.amt}</div></div>${pill(v.status)}</div>`).join('')}</div>`:`<div class="empty">No payments yet. You are on the Free plan.</div>`)+'<p class="meta">Payments are processed by Razorpay. Paid plans renew every month.</p>'}
async function payPlan(n){
 const w=window.open('about:blank','_blank');if(w)w.opener=null;let url='';
 try{const d=await api('/billing/link/',{method:'POST',body:{plan:n}});url=d.short_url||d.url||''}catch(e){}
 if(!RZP_OK.test(url))url=RZP_LINKS[n]||'';
 if(!RZP_OK.test(url)){if(w)w.close();return toast('The Razorpay link for the '+n+' plan is not set up yet. Please contact support.')}
 S.pay={plan:n,url};if(w)w.location.href=url;render()}
async function refreshBill(){try{await hydrate();toast('Plan details refreshed.')}catch(e){toast(e.message)}render()}

/* ===== MukadamHow assistant ===== */
const CH={msgs:[],busy:false},CHIPS=['How do I register?','How do credits work?','मला काम कसे मिळेल?'];
function mkInit(){
 const d=document.createElement('div');
 d.innerHTML=`<button class="mk-fab" id="mk-fab" aria-label="Open MukadamHow assistant" onclick="mkToggle()"><span class="mk-av">M</span>MukadamHow</button><section class="mk" id="mk" role="dialog" aria-label="MukadamHow assistant" hidden><header><span class="mk-av">M</span><div><b>MukadamHow</b><small>KaamSetu assistant · सहायक</small></div><button aria-label="Close assistant" onclick="mkToggle()">✕</button></header><div id="mk-log" aria-live="polite"></div><div id="mk-chips">${CHIPS.map(c=>`<button onclick="mkSend(this.textContent)">${c}</button>`).join('')}</div><div class="mk-in"><input id="mk-i" maxlength="500" aria-label="Your question" placeholder="Ask anything · कुछ भी पूछें" onkeydown="if(event.key==='Enter')mkSend()"><button class="btn gold sm" onclick="mkSend()">Send</button></div></section>`;
 document.body.appendChild(d);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('mk').hidden)mkToggle()});
 mkDraw()}
function mkToggle(){const p=document.getElementById('mk'),o=p.hidden;p.hidden=!o;document.getElementById('mk-fab').hidden=o;if(o)document.getElementById('mk-i').focus()}
function mkDraw(){
 const hi={role:'assistant',content:'Namaste! I am MukadamHow. Ask me how to find work, hire workers, or use KaamSetu. · नमस्ते! मी मुकादम. काम शोधायला किंवा कामगार निवडायला मदत करतो.'};
 const l=document.getElementById('mk-log');
 l.innerHTML=[hi].concat(CH.msgs).map(m=>`<div class="mk-m ${m.role==='user'?'u':'b'}">${esc(m.content)}</div>`).join('')+(CH.busy?'<div class="mk-m b">…</div>':'');
 l.scrollTop=l.scrollHeight;document.getElementById('mk-chips').hidden=CH.msgs.length>0}
async function mkSend(t){
 const i=document.getElementById('mk-i'),q=(t||i.value).trim();if(!q||CH.busy)return;i.value='';
 CH.msgs.push({role:'user',content:q});CH.busy=true;mkDraw();
 try{const r=await api('/chat/',{method:'POST',body:{messages:CH.msgs.slice(-12),role:S.user?S.user.role:''}});CH.msgs.push({role:'assistant',content:r.reply})}
 catch(e){CH.msgs.push({role:'assistant',content:e.status===429?'You have asked a lot just now. Please try again in a while.':e.message})}
 CH.busy=false;mkDraw()}
mkInit();
boot();
</script>
